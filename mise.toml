[tools]
go = "1.27.1"
task = "3.53.1"
node = "26.8.2"
golangci-lint = "2.13.2"

[env]
# The Wails v3 CLI is installed from source by `task tools:wails` rather than
# through mise, so its build always matches the shell's pinned release and the
# GTK4 + WebKitGTK 6.0 system stack.
_.path = ["{{config_root}}/bin"]
