version: '3'

# The single entry point for every dev, build, test, and lint action.
# Run `task --list` to see everything.

vars:
  APP_NAME: posthaste
  APP_ID: io.posthaste.app
  # The desktop entry basename must equal the GApplication ID Wails creates for
  # the shell, so Wayland compositors can associate the window with the entry.
  DESKTOP_ID: org.wails.posthaste
  BIN_DIR: bin
  WAILS_VERSION: v3.0.0-beta.22
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  BINDINGS_DIR: frontend/src/bindings
  # Local install prefix; override on the command line for a system install.
  PREFIX: '{{.PREFIX | default (printf "%s/.local" (env "HOME"))}}'
  ICON_SIZES: 16 24 32 48 64 128 256 512

tasks:
  default:
    cmds:
      - task --list

  # ----- Tooling / dependencies -------------------------------------------------

  tools:
    desc: Install dev tooling (wails3 CLI)
    deps: [tools:wails]

  tools:wails:
    desc: Build the wails3 CLI from source
    status:
      - command -v wails3
    cmds:
      - go install github.com/wailsapp/wails/v3/cmd/wails3@{{.WAILS_VERSION}}

  deps:
    desc: Download Go modules and install frontend packages
    cmds:
      - go mod download
      - task: frontend:install

  frontend:install:
    dir: frontend
    sources: [package.json, package-lock.json]
    generates: [node_modules]
    cmds:
      - npm install

  # ----- Generate ---------------------------------------------------------------

  generate:
    desc: Generate Wails bindings into frontend/src/bindings
    deps: [deps]
    sources:
      - 'main.go'
      - 'internal/**/*.go'
      - 'go.mod'
      - 'go.sum'
    generates:
      - '{{.BINDINGS_DIR}}/**/*'
    cmds:
      - wails3 generate bindings -clean=true -ts -i -d {{.BINDINGS_DIR}}

  # ----- Build / run ------------------------------------------------------------

  build:
    desc: Build the frontend then the app binary
    deps: [generate]
    cmds:
      - task: frontend:build
      - mkdir -p {{.BIN_DIR}}
      - go build -trimpath -o {{.BIN_DIR}}/{{.APP_NAME}} .

  build:core:
    desc: Compile only the framework-agnostic core engine (no cgo, no tags)
    cmds:
      - go build ./internal/...

  frontend:build:
    desc: Production build of the Svelte frontend
    dir: frontend
    cmds:
      - npm run build

  frontend:dev:
    desc: Run the Vite dev server for the frontend
    dir: frontend
    cmds:
      - npm run dev -- --port {{.VITE_PORT}} --strictPort

  dev:
    desc: Run the full app in development mode (hot reload)
    deps: [tools, deps, generate]
    cmds:
      - wails3 dev -config build/config.yml -port {{.VITE_PORT}}

  run:
    desc: Run the built binary
    deps: [build]
    cmds:
      - ./{{.BIN_DIR}}/{{.APP_NAME}}

  # ----- Test -------------------------------------------------------------------

  test:
    desc: Fast hermetic suite — core engine unit tests plus frontend checks
    cmds:
      - go test ./...
      - task: frontend:check

  frontend:check:
    dir: frontend
    cmds:
      - npm run check

  frontend:test:
    dir: frontend
    cmds:
      - npm run test

  test:integration:
    desc: Integration tests against the Dockerised Dovecot + Postfix harness
    deps: [infra:up]
    cmds:
      - go test -tags integration ./...

  test:fuzz:
    desc: Short fuzz run over MIME parsing and HTML sanitization
    cmds:
      - go test -run='^$' -fuzz=FuzzParseMessage -fuzztime=30s ./internal/mail/
      - go test -run='^$' -fuzz=FuzzSanitize -fuzztime=30s ./internal/sanitize/

  # ----- Quality -----------------------------------------------------------------

  lint:
    desc: Lint Go and type-check the frontend
    cmds:
      - golangci-lint run
      - task: frontend:check

  format:
    desc: Format Go and frontend sources
    cmds:
      - gofmt -w .
      - golangci-lint fmt
      - task: frontend:format

  frontend:format:
    dir: frontend
    cmds:
      - npm run format

  # ----- Infrastructure ---------------------------------------------------------

  infra:up:
    desc: Start the Dovecot + Postfix integration test harness
    cmds:
      - docker compose up -d --wait

  infra:down:
    desc: Stop the integration test harness
    cmds:
      - docker compose down -v --remove-orphans

  # ----- Install / packaging ----------------------------------------------------

  # Regenerates the committed hicolor icon set from the 1024px source. Only
  # needed after the logo changes; `install` copies the committed set so it
  # never depends on ImageMagick being present.
  icons:
    desc: Regenerate the Linux hicolor icon set from build/appicon.png
    sources:
      - build/appicon.png
    generates:
      - build/linux/icons/**/*
    cmds:
      - |
        for size in {{.ICON_SIZES}}; do
          dir="build/linux/icons/hicolor/${size}x${size}/apps"
          mkdir -p "$dir"
          magick build/appicon.png -resize "${size}x${size}" -strip "PNG32:$dir/{{.APP_ID}}.png"
        done

  install:
    desc: Build and install the binary, icon, and desktop entry under ~/.local (override with PREFIX)
    deps: [build]
    cmds:
      - install -Dm755 {{.BIN_DIR}}/{{.APP_NAME}} {{.PREFIX}}/bin/{{.APP_NAME}}
      - |
        for size in {{.ICON_SIZES}}; do
          dir="{{.PREFIX}}/share/icons/hicolor/${size}x${size}/apps"
          mkdir -p "$dir"
          install -Dm644 "build/linux/icons/hicolor/${size}x${size}/apps/{{.APP_ID}}.png" "$dir/{{.APP_ID}}.png"
        done
      # Point the launcher at the absolute binary path: an XDG data install
      # under ~/.local/bin is not guaranteed to be on the graphical session's
      # PATH. Write the corrected entry to a hidden temp file and rename it
      # into place, so the destination is never briefly visible with the
      # unmodified `Exec` (desktop shells watch this directory and would
      # otherwise cache the bare, unresolvable command).
      - |
        mkdir -p "{{.PREFIX}}/share/applications"
        tmp="$(mktemp "{{.PREFIX}}/share/applications/.posthaste-desktop.XXXXXX")"
        sed 's|^Exec={{.APP_NAME}}$|Exec={{.PREFIX}}/bin/{{.APP_NAME}}|' build/linux/{{.DESKTOP_ID}}.desktop > "$tmp"
        chmod 644 "$tmp"
        mv -f "$tmp" "{{.PREFIX}}/share/applications/{{.DESKTOP_ID}}.desktop"
      - update-desktop-database {{.PREFIX}}/share/applications >/dev/null 2>&1 || true
      - gtk-update-icon-cache -f -t {{.PREFIX}}/share/icons/hicolor >/dev/null 2>&1 || true
      - 'echo "Installed {{.APP_NAME}} to {{.PREFIX}}/bin/{{.APP_NAME}}; launch it from the app menu or run {{.PREFIX}}/bin/{{.APP_NAME}}."'

  uninstall:
    desc: Remove the locally installed binary, icon, and desktop entry
    cmds:
      - rm -f {{.PREFIX}}/bin/{{.APP_NAME}}
      - rm -f {{.PREFIX}}/share/applications/{{.DESKTOP_ID}}.desktop
      - |
        for size in {{.ICON_SIZES}}; do
          rm -f "{{.PREFIX}}/share/icons/hicolor/${size}x${size}/apps/{{.APP_ID}}.png"
        done
      - update-desktop-database {{.PREFIX}}/share/applications >/dev/null 2>&1 || true
      - gtk-update-icon-cache -f -t {{.PREFIX}}/share/icons/hicolor >/dev/null 2>&1 || true

  package:
    desc: Build a pacman package from the local tree via packaging/PKGBUILD
    cmds:
      - makepkg --force --cleanbuild --dir packaging -p PKGBUILD

  clean:
    desc: Remove build outputs and caches
    cmds:
      - rm -rf {{.BIN_DIR}} frontend/dist frontend/src/bindings frontend/node_modules/.vite
