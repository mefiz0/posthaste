# Minimal IMAP server for the integration-test harness: one plaintext port,
# one test user, Maildir storage shared with the postfix container.

listen = *

protocols = imap
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login

log_path = /dev/stderr
info_log_path = /dev/stderr
debug_log_path = /dev/stderr

# The postfix container delivers into /var/mail/<user> as a Maildir, so the
# same layout is used for IMAP access.
mail_location = maildir:/var/mail/%u
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000

namespace inbox {
  inbox = yes
  separator = /
}

passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT username_format=%u /etc/dovecot/users
}

userdb {
  driver = static
  args = uid=5000 gid=5000 home=/var/mail/home/%u
}

service imap-login {
  inet_listener imap {
    port = 143
  }
}
